aid: vana
name: Vana
description: >-
  Vana is an open protocol for user-owned, portable personal data — sovereign
  data infrastructure for the AI economy. Users store personal data in
  Personal Servers, grant builders access via signed, scope-native EIP-712
  permissions, pay protocol fees from an onchain escrow, and revoke access at
  any time, with all consent recorded on the EVM-compatible Vana L1. Builders
  integrate through the @opendatalabs/vana-sdk, the Data Portability RPC, a
  local-first data-collection CLI, and an MCP interface on every Personal
  Server. Stewarded by the Vana Foundation and developed by Open Data Labs;
  backed by Paradigm.
