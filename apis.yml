apis:
- name: Vana Data Portability RPC
  description: >-
    The protocol's read/write boundary — a caching and relay layer between
    protocol participants and the Vana L1 covering the onchain primitives
    (identity, permissions, fees, PGE, schemas, files, DLP contracts) with
    EIP-712 verification and the L1 settlement path. Builders' requests to
    users' Personal Servers (REST /v1: data, grants, access logs) are
    authorized with Web3Signed headers under scope-native grants.
  humanURL: https://docs.vana.org/protocol-reference/dp-rpc
  baseURL: https://dp-rpc.vana.org
  tags:
  - Data Portability
  - Grants
  - Permissions
  - Escrow
  properties:
  - type: Documentation
    url: https://docs.vana.org/protocol-reference/dp-rpc
  - type: APIReference
    url: https://docs.vana.org/protocol-reference/personal-servers
- name: Vana L1 JSON-RPC
  description: >-
    Standard Ethereum JSON-RPC for the EVM-compatible Vana L1 blockchain,
    which records registrations, grants, file records, and schemas. Mainnet
    at rpc.vana.org (explorer vanascan.io); Moksha testnet at
    rpc.moksha.vana.org (chain ID 14800, explorer moksha.vanascan.io, faucet
    faucet.vana.org).
  humanURL: https://docs.vana.org/network/vana-l1
  baseURL: https://rpc.vana.org
  tags:
  - Blockchain
  - JSON-RPC
  - EVM
  properties:
  - type: Documentation
    url: https://docs.vana.org/network/vana-l1
